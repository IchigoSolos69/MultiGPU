[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multigpu-local"
version = "0.2.0"
description = "Train with your own local and notebook compute accounts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
training = ["torch==2.14.1"]
image = ["torch==2.14.1", "torchvision==0.29.1", "Pillow==12.3.0"]
kaggle = ["kaggle>=2.2.3"]
modal = ["modal>=1.0"]
lightning = ["lightning-sdk"]

[project.scripts]
multigpu = "multigpu.server:main"

[tool.setuptools.packages.find]
include = ["multigpu*"]

[tool.setuptools.package-data]
multigpu = ["static/*"]
